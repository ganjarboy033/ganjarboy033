  <text x="42" y="312" class="f" style="animation-delay:3.30s"><tspan fill="#e2e8f0" font-weight="700">uploader-svc</tspan><tspan class="d" xml:space="preserve">     </tspan><tspan fill="#22d3ee">running (oauth)</tspan><tspan class="d" xml:space="preserve">     batch repo manager · APK + web</tspan></text>
