  <text x="42" y="272" class="f" style="animation-delay:3.00s"><tspan fill="#e2e8f0" font-weight="700">nexora-cloud</tspan><tspan class="d" xml:space="preserve">     </tspan><tspan fill="#34d399">active (running)</tspan><tspan class="d" xml:space="preserve">  hybrid android cloud · file explorer</tspan></text>
