<svg xmlns="http://www.w3.org/2000/svg" width="960" height="452" viewBox="0 0 960 452">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1120"/>
    <stop offset="1" stop-color="#101a33"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0e1730"/>
    <stop offset="1" stop-color="#0b1224"/>
  </linearGradient>
  <linearGradient id="artGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset=".5" stop-color="#818cf8"/>
    <stop offset="1" stop-color="#34d399"/>
    <animate attributeName="x1" values="0;1;0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#22d3ee" stroke-opacity=".055" stroke-width="1"/>
  </pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" opacity=".022"/>
  </pattern>
  <clipPath id="typingClip"><rect id="typingRect" x="178" y="52" width="206" height="19" class="typ"/></clipPath>
</defs>

<style>
  text{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace;}
  .f{animation:fi .45s ease both}
  @keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .p{fill:#34d399;font-weight:700}
  .k{fill:#818cf8;font-weight:700}
  .c{fill:#22d3ee;font-weight:700}
  .w{fill:#cbd5e1}
  .v{fill:#c3d2e8}
  .d{fill:#64748b}
  .art{fill:url(#artGrad);font-weight:700;filter:url(#glow)}
  .cur{animation:bl 1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .typ{animation:ty 1.15s steps(24) .55s both}
  @keyframes ty{from{width:0}to{width:206px}}
  .pulse{animation:pu 1.6s ease-in-out infinite}
  @keyframes pu{0%,100%{opacity:1}50%{opacity:.35}}
</style>

<!-- window shell -->
<rect x="2" y="2" width="956" height="448" rx="14" fill="url(#bg)" stroke="#2b3a58" stroke-width="1"/>
<rect x="2" y="2" width="956" height="448" rx="14" fill="url(#grid)"/>
<rect x="2" y="2" width="956" height="448" rx="14" fill="url(#scan)"/>

<!-- title bar -->
<rect x="2" y="2" width="956" height="38" rx="14" fill="#121c36"/>
<rect x="2" y="24" width="956" height="16" fill="#121c36"/>
<line x1="2" y1="40" x2="958" y2="40" stroke="#26365c"/>
<circle cx="26" cy="21" r="6" fill="#22d3ee"/>
<circle cx="46" cy="21" r="6" fill="#818cf8"/>
<circle cx="66" cy="21" r="6" fill="#34d399"/>
<text x="480" y="26" text-anchor="middle" font-size="13" class="d">gnzx@kruzenlab: ~/kruzen-stack — zsh</text>
<rect x="834" y="11" width="112" height="20" rx="10" fill="#0f2a22" stroke="#1f6f54"/>
<circle cx="850" cy="21" r="3.5" fill="#34d399" class="pulse"/>
<text x="859" y="25" font-size="11" fill="#6ee7b7">LIVE · CI:OK</text>

<!-- prompt line -->
<text x="24" y="67" font-size="15">
  <tspan class="p">gnzx@kruzenlab</tspan><tspan class="w">:</tspan><tspan class="k">~</tspan><tspan class="w" xml:space="preserve">$ </tspan>
</text>
<g clip-path="url(#typingClip)">
  <text x="178" y="67" font-size="15" class="v">neofetch --boot kruzenlab</text>
</g>
<rect x="392" y="53" width="9" height="15" fill="#22d3ee" class="cur"/>

<!-- pixel-block banner: B A G J A -->
<g class="art" font-size="15" xml:space="preserve">
  <text x="26" y="104">███ .██. .███ ..██ .██.</text>
  <text x="26" y="122">█..█ █..█ █... ..█. █..█</text>
  <text x="26" y="140">███. ████ █.██ ..█. ████</text>
  <text x="26" y="158">█..█ █..█ █..█ █..█ █..█</text>
  <text x="26" y="176">███. █..█ .███ .██. █..█</text>
</g>
